# Manifold Verify GitHub Action
# Validates constraint manifolds in CI/CD pipelines
#
# Usage in your workflow:
#   - uses: dhanesh/manifold/.github/workflows/manifold-verify.yml@main
#     with:
#       feature: my-feature  # optional, defaults to all manifolds

name: Manifold Verify

on:
  workflow_call:
    inputs:
      feature:
        description: 'Feature name to verify (optional, verifies all if not specified)'
        required: false
        type: string
      fail-on-gaps:
        description: 'Fail if non-blocking gaps are found'
        required: false
        type: boolean
        default: false
      manifold-version:
        description: 'Manifold CLI version to install ("latest" or e.g. 2.35.1)'
        required: false
        type: string
        default: latest

jobs:
  verify:
    name: Verify Manifold Constraints
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Manifold CLI
        env:
          MANIFOLD_VERSION_INPUT: ${{ inputs.manifold-version }}
        run: |
          set -euo pipefail

          # Resolve "latest" to a concrete tag. A hardcoded default goes stale
          # silently: v2.0.0 predates JSON+Markdown manifests and reports
          # "Manifold file not found" for every one of them.
          VERSION="${MANIFOLD_VERSION_INPUT:-latest}"
          if [ "$VERSION" = "latest" ]; then
            VERSION=$(curl -fsSLI -o /dev/null -w '%{url_effective}' \
              https://github.com/dhanesh/manifold/releases/latest | sed 's#.*/tag/##')
            echo "Resolved latest release to ${VERSION}"
          fi
          VERSION="${VERSION#v}"

          PLATFORM="linux-x64"
          BINARY_URL="https://github.com/dhanesh/manifold/releases/download/v${VERSION}/manifold-${PLATFORM}"

          if curl -fsSL "$BINARY_URL" -o /tmp/manifold; then
            chmod +x /tmp/manifold
            sudo mv /tmp/manifold /usr/local/bin/manifold
            echo "Installed Manifold CLI v${VERSION}"
          elif [ -f cli/index.ts ]; then
            echo "Binary not available, building from source..."
            cd cli
            bun install
            bun run compile
            sudo mv ./manifold /usr/local/bin/manifold
            echo "Built Manifold CLI from source"
          else
            echo "::error::Could not download Manifold CLI from ${BINARY_URL}, and this repository has no cli/ source tree to build from."
            exit 1
          fi

          manifold --version

      - name: Check for manifold directory
        id: check-manifold
        run: |
          if [ -d ".manifold" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "Manifold directory found"
            ls -la .manifold/
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "No .manifold directory found - skipping verification"
          fi

      # Selection happens once, here, and is reused by every step below.
      # Previously each step re-globbed independently and all three drifted.
      - name: Select manifolds
        id: select
        if: steps.check-manifold.outputs.found == 'true'
        env:
          FEATURE_INPUT: ${{ inputs.feature }}
        run: |
          set -euo pipefail

          if [ -n "$FEATURE_INPUT" ]; then
            echo "$FEATURE_INPUT" > /tmp/manifold-features.txt
          else
            SELECTOR=scripts/select-manifolds.sh
            if [ -x "$SELECTOR" ]; then
              "$SELECTOR" .manifold > /tmp/manifold-features.txt
            else
              # Consumers of this reusable workflow do not vendor the script.
              for f in .manifold/*.json .manifold/*.yaml .manifold/*.yml; do
                [ -f "$f" ] || continue
                name="${f##*/}"; name="${name%.json}"; name="${name%.yaml}"; name="${name%.yml}"
                case "$name" in *.anchor | *.verify | *.integrate) continue ;; esac
                echo "$name"
              done | sort -u > /tmp/manifold-features.txt
            fi
          fi

          COUNT=$(wc -l < /tmp/manifold-features.txt | tr -d ' ')
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "Selected $COUNT manifold(s):"
          cat /tmp/manifold-features.txt

          # A verification step that finds nothing to verify must not be green.
          # This is the guard that would have caught the *.yaml glob drift.
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::.manifold exists but no feature manifolds were selected. Expected <feature>.json or <feature>.yaml files."
            exit 1
          fi

      - name: Validate manifold schemas
        if: steps.check-manifold.outputs.found == 'true'
        run: |
          set -euo pipefail
          while read -r feature; do
            [ -n "$feature" ] || continue
            echo "Validating: $feature"
            manifold validate "$feature" --json || exit 1
          done < /tmp/manifold-features.txt

      - name: Verify artifact coverage
        if: steps.check-manifold.outputs.found == 'true'
        shell: bash {0}
        env:
          FAIL_ON_GAPS: ${{ inputs.fail-on-gaps }}
        run: |
          EXIT_CODE=0

          while read -r feature; do
            [ -n "$feature" ] || continue
            echo "Verifying: $feature"
            manifold verify "$feature" --json
            RESULT=$?
            if [ $RESULT -eq 2 ]; then
              echo "::warning::Verification found gaps for $feature"
              if [ "$FAIL_ON_GAPS" == "true" ]; then
                EXIT_CODE=1
              fi
            elif [ $RESULT -ne 0 ]; then
              EXIT_CODE=1
            fi
          done < /tmp/manifold-features.txt

          exit $EXIT_CODE

      - name: Generate status summary
        if: steps.check-manifold.outputs.found == 'true'
        run: |
          echo "## Manifold Verification Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Verified ${{ steps.select.outputs.count }} manifold(s)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          while read -r feature; do
            [ -n "$feature" ] || continue
            echo "### $feature" >> $GITHUB_STEP_SUMMARY
            manifold status "$feature" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          done < /tmp/manifold-features.txt
