name: Idea or feature request
description: Something Manifold should do that it doesn't.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation you're stuck in, not the solution you have in mind. That comes next.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you'd like Manifold to do
      description: Rough is fine. A sketch of the command or output you wish existed helps a lot.
    validations:
      required: false
